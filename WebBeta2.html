<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUXURY_SL - Oficial</title>
<style>
:root{
  --bg:#000;
  --fg:#fff;
  --muted:#aaa;
  --glass:rgba(255,255,255,0.05);
  --glass-strong:rgba(255,255,255,0.12);
  --trans:0.35s;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif;}
body{background:var(--bg);color:var(--fg);overflow-x:hidden;transition:background 0.3s;font-size:16px;}
body.video-hidden #videoBackground{opacity:0;}

/* Video */
#videoBackground{position:fixed; inset:0;width:100%;height:100%;object-fit:cover;z-index:-5;opacity:1;transition:opacity 1s;filter:brightness(1.3) contrast(1.1);}
#overlayBg{position:fixed; inset:0;background: rgba(0,0,0,0.5); z-index:-4;}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;position:sticky;top:0;backdrop-filter: blur(6px);background: rgba(0,0,0,0.45);border-bottom:1px solid rgba(255,255,255,0.08);z-index:80;}
header img.logo{height:56px;}
header h1{color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:2px;}
#userArea{display:flex;align-items:center;gap:8px;}
#userArea button{padding:8px 14px;border-radius:12px;background:var(--glass-strong);border:1px solid rgba(255,255,255,0.2);color:var(--fg);font-weight:700;cursor:pointer;}
#userArea button:hover{background:var(--glass);}

/* Main */
main{padding:28px 20px 60px;max-width:1200px;margin:0 auto;text-align:center;}
.center-logo{width:300px;max-width:68%;margin:48px auto 28px;filter:drop-shadow(0 8px 25px rgba(0,0,0,0.7));}

/* Cards */
.sections{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
.card{flex:1 1 200px;padding:40px;border-radius:16px;background:var(--glass-strong);cursor:pointer;transition:transform var(--trans),background var(--trans);}
.card:hover{transform:translateY(-4px);background:var(--glass);}
#officialCard{width:calc(100% - 20px);max-width:800px;margin:30px auto;padding:40px;border-radius:16px;background:var(--glass-strong);cursor:pointer;transition:transform var(--trans);}
#officialCard:hover{transform:translateY(-4px);background:var(--glass);}

/* Section Content */
.sectionContent{display:none;padding:40px;max-width:1200px;margin:0 auto;}
.sectionContent.show{display:block;}
.backBtn{padding:10px 18px;border-radius:8px;background:var(--glass-strong);border:1px solid rgba(255,255,255,0.2);color:var(--fg);cursor:pointer;margin-bottom:18px;}
.backBtn:hover{background:var(--glass);}

/* Login Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;justify-content:center;align-items:center;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.overlay.show{opacity:1;pointer-events:auto;}
.overlay .box{background:#111;padding:30px;border-radius:12px;width:300px;position:relative;}
.overlay .box h3{margin-bottom:16px;}
.overlay .input-group{margin-bottom:12px;}
.overlay input{width:100%;padding:8px;border:none;border-radius:6px;background:#222;color:#fff;}
.overlay .btn{width:100%;padding:10px;border:none;background:#444;color:#fff;border-radius:6px;cursor:pointer;margin-top:6px;}
.overlay .switchBtn{background:none;border:none;color:var(--muted);cursor:pointer;margin-top:8px;font-size:12px;}

/* Comments */
.comments{background:#000;padding:20px;border-radius:10px;margin-top:30px;color:#fff;}
.comments h3{margin-bottom:10px;}
.comments textarea{width:100%;height:80px;background:#111;color:#fff;border:none;border-radius:6px;padding:8px;}
.comments button{padding:8px 14px;margin-top:6px;border:none;background:#fff;color:#000;border-radius:6px;cursor:pointer;}
.commentItem{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1);}
.commentItem strong{color:#fff;}

/* Stars */
#Oficial .star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;opacity:0.8;animation:fall linear infinite;}
@keyframes fall{0%{transform:translateY(0);}100%{transform:translateY(120vh);}}

#messageBox{position:fixed;bottom:20px;right:20px;background:#333;color:#fff;padding:10px 14px;border-radius:6px;display:none;opacity:0;transition:opacity 0.3s;z-index:500;}

/* Responsive */
@media(max-width:720px){
  .sections{flex-direction:column;gap:14px;}
  .card{padding:28px;}
  .center-logo{width:220px;}
}
@media(max-width:420px){
  header h1{font-size:1rem;}
  .center-logo{width:180px;}
}
</style>
</head>
<body>

<video id="videoBackground" autoplay muted loop playsinline>
  <source src="fondo.mp4" type="video/mp4">
  Tu navegador no soporta video HTML5.
</video>
<div id="overlayBg"></div>

<header>
  <img src="https://i.imgur.com/FG6uNYF.png" class="logo">
  <h1>LUXURY_SL</h1>
  <div id="userArea">
    <span id="userLabel" style="display:none;"></span>
    <button id="openLoginBtn">Entrar / Registrarse</button>
  </div>
</header>

<main id="mainMenu">
  <img src="https://i.imgur.com/BqUJceo.jpeg" class="center-logo">
  <div class="sections">
    <div class="card" data-section="Herramientas">Herramientas</div>
    <div class="card" data-section="3DBlender">3D Blender</div>
    <div class="card" data-section="Arduino">Arduino</div>
  </div>
  <div id="officialCard" class="card" data-section="Oficial">Oficial</div>
</main>

<section id="Herramientas" class="sectionContent">
  <button class="backBtn">VOLVER</button>
  <h2>Herramientas</h2>
  <p>Contenido de Herramientas...</p>
</section>

<section id="3DBlender" class="sectionContent">
  <button class="backBtn">VOLVER</button>
  <h2>3D Blender</h2>
  <p>Contenido de 3D Blender...</p>
</section>

<section id="Arduino" class="sectionContent">
  <button class="backBtn">VOLVER</button>
  <h2>Arduino</h2>
  <p>Contenido de Arduino...</p>
</section>

<section id="Oficial" class="sectionContent" style="position:relative;">
  <button class="backBtn">VOLVER</button>
  <h2>Página Oficial</h2>
  <p>Explora nuestro proyecto con estilo y estrellas blancas cayendo.</p>
  <div class="comments">
    <h3>Comentarios</h3>
    <div id="commentsList"></div>
    <form id="commentForm">
      <textarea id="commentText" placeholder="Escribe tu comentario..."></textarea>
      <button type="submit">Agregar comentario</button>
    </form>
  </div>
</section>

<div class="overlay" id="loginOverlay">
  <div class="box">
    <button onclick="closeLogin()" style="position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;">✖</button>
    <h3 id="loginTitle">Iniciar sesión</h3>
    <div class="input-group"><input id="email" type="email" placeholder="Correo"></div>
    <div class="input-group" id="usernameGroup"><input id="username" type="text" placeholder="Nombre de usuario"></div>
    <div class="input-group"><input id="password" type="password" placeholder="Contraseña"></div>
    <button class="btn" id="primaryAuthBtn">Entrar</button>
    <button class="switchBtn" id="switchModeBtn">¿No tienes cuenta? Crear cuenta</button>
  </div>
</div>

<div id="messageBox"></div>

<script>
// Variables
const LS_USERS='luxuryUsers_v3';
const LS_CURRENT='luxuryCurrentUser_v3';
let users=JSON.parse(localStorage.getItem(LS_USERS)||'{}');
let currentUser=JSON.parse(localStorage.getItem(LS_CURRENT)||'null');
let authMode='login';

const loginOverlay=document.getElementById('loginOverlay');
const openLoginBtn=document.getElementById('openLoginBtn');
const primaryAuthBtn=document.getElementById('primaryAuthBtn');
const switchModeBtn=document.getElementById('switchModeBtn');
const emailInput=document.getElementById('email');
const usernameInput=document.getElementById('username');
const passwordInput=document.getElementById('password');
const userLabel=document.getElementById('userLabel');
const mainMenu=document.getElementById('mainMenu');
const videoBg=document.getElementById('videoBackground');
const messageBox=document.getElementById('messageBox');
const sections=document.querySelectorAll('.sectionContent');
const cards=document.querySelectorAll('.card');

// Toast
let msgTimeout;
function showMessage(msg){
  if(msgTimeout) clearTimeout(msgTimeout);
  messageBox.innerText=msg;
  messageBox.style.display='block';
  void messageBox.offsetWidth;
  messageBox.style.opacity='1';
  msgTimeout=setTimeout(()=>{messageBox.style.opacity='0'; setTimeout(()=>messageBox.style.display='none',300);},2200);
}

// Login UI
function openLogin(){
  authMode='login';
  document.getElementById('loginTitle').innerText='Iniciar sesión';
  primaryAuthBtn.innerText='Entrar';
  switchModeBtn.innerText='¿No tienes cuenta? Crear cuenta';
  emailInput.value=''; usernameInput.value=''; passwordInput.value='';
  usernameInput.parentElement.style.display='none';
  loginOverlay.classList.add('show');
}
function closeLogin(){ loginOverlay.classList.remove('show'); }
function switchMode(){
  if(authMode==='login'){
    authMode='register';
    document.getElementById('loginTitle').innerText='Crear cuenta';
    primaryAuthBtn.innerText='Registrar';
    switchModeBtn.innerText='¿Ya tienes cuenta? Iniciar sesión';
    usernameInput.parentElement.style.display='block';
    emailInput.value=''; usernameInput.value=''; passwordInput.value='';
  } else {
    authMode='login';
    document.getElementById('loginTitle').innerText='Iniciar sesión';
    primaryAuthBtn.innerText='Entrar';
    switchModeBtn.innerText='¿No tienes cuenta? Crear cuenta';
    usernameInput.parentElement.style.display='none';
    emailInput.value=''; usernameInput.value=''; passwordInput.value='';
  }
}

// Auth
function saveUsers(){ localStorage.setItem(LS_USERS,JSON.stringify(users)); }
function saveCurrentUser(){ localStorage.setItem(LS_CURRENT,JSON.stringify(currentUser)); }
function performAuth(){
  const email=emailInput.value.trim();
  const username=usernameInput.value.trim();
  const password=passwordInput.value;
  if(!email||!password||(authMode==='register'&&!username)){ showMessage('Rellena los campos correctamente'); return; }
  if(authMode==='register'){
    if(users[email]){ showMessage('Correo ya registrado'); return; }
    users[email]={username,password};
    currentUser=email; saveUsers(); saveCurrentUser(); updateUIAfterLogin(); closeLogin(); openSection(null); showMessage('Cuenta creada'); 
  } else {
    if(!users[email]){ showMessage('Correo no registrado'); return; }
    if(users[email].password!==password){ showMessage('Contraseña incorrecta'); return; }
    currentUser=email; saveCurrentUser(); updateUIAfterLogin(); closeLogin(); openSection(null); showMessage('Sesión iniciada'); 
  }
}

// UI
function updateUIAfterLogin(){
  if(currentUser){
    userLabel.style.display='inline-block';
    userLabel.innerText=users[currentUser].username||currentUser;
    openLoginBtn.style.display='none';
    if(!document.getElementById('logoutBtn')){
      const btn=document.createElement('button');
      btn.id='logoutBtn'; btn.innerText='Cerrar sesión';
      btn.onclick=logout; document.getElementById('userArea').appendChild(btn);
    } else document.getElementById('logoutBtn').style.display='inline-block';
  } else {
    userLabel.style.display='none'; openLoginBtn.style.display='inline-block';
    const btn=document.getElementById('logoutBtn'); if(btn) btn.remove();
  }
}
function logout(){ currentUser=null; saveCurrentUser(); updateUIAfterLogin(); showMessage('Sesión cerrada'); }

// Sections
function openSection(id){
  sections.forEach(sec=>{ sec.classList.remove('show'); });
  if(!id){ mainMenu.style.display='block'; document.body.classList.remove('video-hidden'); return; }
  if(id==='Oficial'&&!currentUser){ openLogin(); return; }
  mainMenu.style.display='none'; document.body.classList.add('video-hidden');
  const sec=document.getElementById(id); if(sec){ sec.classList.add('show'); if(id==='Oficial') addStars(50);}
}
cards.forEach(card=> card.addEventListener('click',()=> openSection(card.dataset.section)));
document.querySelectorAll('.backBtn').forEach(btn=> btn.addEventListener('click',()=> openSection(null)));

// Overlay events
openLoginBtn.addEventListener('click',openLogin);
switchModeBtn.addEventListener('click',switchMode);
primaryAuthBtn.addEventListener('click',performAuth);

// Stars
function addStars(count=50){
  const sec=document.getElementById('Oficial');
  sec.querySelectorAll('.star').forEach(s=>s.remove());
  for(let i=0;i<count;i++){
    const s=document.createElement('div'); s.className='star';
    const size=2+Math.random()*4; s.style.width=size+'px'; s.style.height=size+'px';
    s.style.left=(Math.random()*95)+'%'; s.style.top=(-10-Math.random()*40)+'%';
    s.style.animationDelay=(Math.random()*10)+'s';
    s.style.animationDuration=(8+Math.random()*10)+'s';
    sec.appendChild(s);
  }
}

// Comments
let comments=JSON.parse(localStorage.getItem('luxuryComments_v2')||'[]');
const commentsList=document.getElementById('commentsList');
const commentForm=document.getElementById('commentForm');
const commentText=document.getElementById('commentText');
function renderComments(){
  commentsList.innerHTML='';
  comments.forEach((c,i)=>{
    const div=document.createElement('div'); div.className='commentItem';
    div.innerHTML=`<strong>${c.user}:</strong> ${c.text} <button onclick="deleteComment(${i})">Eliminar</button>`;
    commentsList.appendChild(div);
  });
}
window.deleteComment=function(index){
  comments.splice(index,1);
  localStorage.setItem('luxuryComments_v2',JSON.stringify(comments));
  renderComments();
}
commentForm.addEventListener('submit',e=>{
  e.preventDefault();
  if(!currentUser) return;
  comments.push({user:users[currentUser].username,text:commentText.value.trim()});
  localStorage.setItem('luxuryComments_v2',JSON.stringify(comments));
  commentText.value='';
  renderComments();
});

// Init
updateUIAfterLogin();
renderComments();
</script>

</body>
</html>
