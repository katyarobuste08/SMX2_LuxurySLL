<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUXURY_SL - Oficial</title>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #aaa;
      --glass: rgba(255,255,255,0.05);
      --glass-strong: rgba(255,255,255,0.12);
      --trans: 0.35s;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
    body {
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
      transition: background 0.3s;
      font-size: 16px;
    }
    body.video-hidden #videoBackground {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #videoBackground {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -5;
      opacity: 1;
      transition: opacity 0.5s;
      filter: brightness(1.3) contrast(1.2);
    }
    #overlayBg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: -4;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 90;
    }
    header img.logo {
      height: 56px;
      transition: transform 0.3s;
    }
    header img.logo:hover {
      transform: scale(1.1);
    }
    header h1 {
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    header h1:hover {
      color: #fff;
    }
    #userArea {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #userArea button {
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--glass-strong);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--fg);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--trans);
    }
    #userArea button:hover {
      transform: translateY(-2px);
      background: var(--glass);
    }
    main {
      padding: 28px 20px 60px;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      transition: all 0.5s ease;
    }
    .center-logo {
      width: 300px;
      max-width: 68%;
      margin: 48px auto 28px;
      filter: drop-shadow(0 12px 25px rgba(255,255,255,0.6));
      transition: transform 0.4s, filter 0.4s;
    }
    .center-logo:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 12px 40px rgba(255,255,255,0.8));
    }
    .sections {
      display: flex;
      gap: 22px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
      transition: all 0.4s;
    }
    .card {
      flex: 1 1 220px;
      padding: 40px;
      border-radius: 16px;
      background: var(--glass-strong);
      cursor: pointer;
      transition: transform var(--trans), background var(--trans), box-shadow var(--trans);
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.03);
      background: var(--glass);
      box-shadow: 0 12px 30px rgba(255,255,255,0.3);
    }
    #officialCard {
      margin-top: 30px;
    }
    .sectionContent {
      display: none;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      transition: all 0.5s ease;
    }
    .sectionContent.show {
      display: block;
    }
    .backBtn {
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--glass-strong);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--fg);
      cursor: pointer;
      margin-bottom: 18px;
      transition: transform 0.3s, background 0.3s;
    }
    .backBtn:hover {
      transform: translateY(-2px);
      background: var(--glass);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .overlay .box {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      position: relative;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    .overlay .box h3 { margin-bottom: 16px; }
    .overlay .input-group { margin-bottom: 12px; }
    .overlay input {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      background: #222; color: #fff;
    }
    .overlay .btn {
      width: 100%; padding: 10px; border: none;
      background: #444; color: #fff; border-radius: 6px;
      cursor: pointer; margin-top: 6px; transition: transform 0.3s;
    }
    .overlay .btn:hover {
      transform: translateY(-2px); background: #555;
    }
    .overlay .switchBtn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; margin-top: 8px; font-size: 12px;
    }
    .comments {
      background: #000; padding: 20px; border-radius: 12px; margin-top: 30px;
      color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.2);
    }
    .comments h3 { margin-bottom: 10px; }
    .comments textarea {
      width: 100%; height: 80px; background: #111; color: #fff;
      border: none; border-radius: 6px; padding: 8px;
    }
    .comments button {
      padding: 8px 14px; margin-top: 6px; border: none;
      background: #fff; color: #000; border-radius: 6px;
      cursor: pointer; transition: transform 0.2s;
    }
    .comments button:hover {
      transform: translateY(-2px); background: #ddd;
    }
    .commentItem {
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .commentItem strong { color: #fff; }
    #Oficial .star {
      position: absolute; width: 4px; height: 4px;
      background: #fff; border-radius: 50%; opacity: 0.8;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0); }
      100% { transform: translateY(120vh); }
    }
    #messageBox {
      position: fixed; bottom: 20px; right: 20px;
      background: #333; color: #fff; padding: 10px 14px;
      border-radius: 6px; display: none; opacity: 0;
      transition: opacity 0.3s; z-index: 500;
    }
    @media(max-width:720px) {
      .sections { flex-direction: column; gap: 14px; }
      .card { padding: 28px; }
      .center-logo { width: 220px; }
    }
    @media(max-width:420px) {
      header h1 { font-size: 1rem; }
      .center-logo { width: 180px; }
    }
  </style>
</head>
<body>

  <video id="videoBackground" autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/katyarobuste08/SMX2_LuxurySLL/refs/heads/luxurySL-website/fondo.mp4?token=GHSAT0AAAAAADMWO44XEEM5IK3F5OTZ2QFU2HGACVA" type="video/mp4">
    Tu navegador no soporta video HTML5.
  </video>
  <div id="overlayBg"></div>

  <header>
    <img src="https://i.imgur.com/FG6uNYF.png" class="logo" alt="Logo">
    <h1>LUXURY_SL</h1>
    <div id="userArea">
      <span id="userLabel" style="display:none;"></span>
      <button id="openLoginBtn">Entrar / Registrarse</button>
    </div>
  </header>

  <main id="mainMenu">
    <img src="https://i.imgur.com/BqUJceo.jpeg" class="center-logo" alt="Logo central">
    <div class="sections">
      <div class="card" data-section="Herramientas">Herramientas</div>
      <div class="card" data-section="3DBlender">3D Blender</div>
      <div class="card" data-section="Arduino">Arduino</div>
    </div>
    <div class="sections">
      <div class="card" id="officialCard" data-section="Oficial">Página Oficial</div>
    </div>
  </main>

  <section id="Herramientas" class="sectionContent">
    <button class="backBtn">VOLVER</button>
    <h2>Herramientas</h2>
    <p>Contenido de Herramientas...</p>
  </section>

  <section id="3DBlender" class="sectionContent">
    <button class="backBtn">VOLVER</button>
    <h2>3D Blender</h2>
    <p>Contenido de Blender...</p>
  </section>

  <section id="Arduino" class="sectionContent">
    <button class="backBtn">VOLVER</button>
    <h2>Arduino</h2>
    <p>Contenido de Arduino...</p>
  </section>

  <section id="Oficial" class="sectionContent">
    <button class="backBtn">VOLVER</button>
    <h2>Página Oficial</h2>
    <div class="comments">
      <h3>Comentarios</h3>
      <form id="commentForm">
        <textarea id="commentText" placeholder="Escribe tu comentario..."></textarea>
        <button type="submit">Enviar</button>
      </form>
      <div id="commentsList"></div>
    </div>
  </section>

  <div class="overlay" id="loginOverlay">
    <div class="box">
      <button onclick="closeLogin()" style="position:absolute; top:10px; right:12px; background:none; border:none; color: var(--muted); font-size:18px; cursor:pointer;">✖</button>
      <h3 id="loginTitle">Iniciar sesión</h3>
      <div class="input-group" id="usernameGroup"><input id="username" type="text" placeholder="Nombre de usuario"></div>
      <div class="input-group"><input id="email" type="email" placeholder="Correo"></div>
      <div class="input-group"><input id="password" type="password" placeholder="Contraseña"></div>
      <button class="btn" id="primaryAuthBtn">Entrar</button>
      <button class="switchBtn" id="switchModeBtn">¿No tienes cuenta? Crear cuenta</button>
    </div>
  </div>

  <div id="messageBox"></div>

  <script>
    console.log("Script arrancando...");

    const LS_USERS = 'luxuryUsers_v7';
    const LS_CURRENT = 'luxuryCurrentUser_v7';
    let users = JSON.parse(localStorage.getItem(LS_USERS) || '{}');
    let currentUser = JSON.parse(localStorage.getItem(LS_CURRENT) || 'null');
    let authMode = 'login';

    console.log("Usuarios:", users);
    console.log("Usuario actual:", currentUser);

    const loginOverlay = document.getElementById('loginOverlay');
    const openLoginBtn = document.getElementById('openLoginBtn');
    const primaryAuthBtn = document.getElementById('primaryAuthBtn');
    const switchModeBtn = document.getElementById('switchModeBtn');
    const emailInput = document.getElementById('email');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const userLabel = document.getElementById('userLabel');
    const mainMenu = document.getElementById('mainMenu');
    const videoBg = document.getElementById('videoBackground');
    const messageBox = document.getElementById('messageBox');
    const sections = document.querySelectorAll('.sectionContent');
    const cards = document.querySelectorAll('.card');

    let msgTimeout;
    function showMessage(msg) {
      console.log("Mensaje:", msg);
      if (msgTimeout) clearTimeout(msgTimeout);
      messageBox.innerText = msg;
      messageBox.style.display = 'block';
      void messageBox.offsetWidth;
      messageBox.style.opacity = '1';
      msgTimeout = setTimeout(() => {
        messageBox.style.opacity = '0';
        setTimeout(() => messageBox.style.display = 'none', 300);
      }, 2200);
    }

    function openLogin() {
      console.log("Abrir login, modo:", authMode);
      authMode = 'login';
      document.getElementById('loginTitle').innerText = 'Iniciar sesión';
      primaryAuthBtn.innerText = 'Entrar';
      switchModeBtn.innerText = '¿No tienes cuenta? Crear cuenta';
      emailInput.value = '';
      usernameInput.value = '';
      passwordInput.value = '';
      usernameInput.parentElement.style.display = 'none';
      loginOverlay.classList.add('show');
    }
    function closeLogin() {
      console.log("Cerrar login");
      loginOverlay.classList.remove('show');
    }
    function switchMode() {
      console.log("Cambiar modo desde:", authMode);
      if (authMode === 'login') {
        authMode = 'register';
        document.getElementById('loginTitle').innerText = 'Crear cuenta';
        primaryAuthBtn.innerText = 'Registrar';
        switchModeBtn.innerText = '¿Ya tienes cuenta? Iniciar sesión';
        usernameInput.parentElement.style.display = 'block';
      } else {
        authMode = 'login';
        document.getElementById('loginTitle').innerText = 'Iniciar sesión';
        primaryAuthBtn.innerText = 'Entrar';
        switchModeBtn.innerText = '¿No tienes cuenta? Crear cuenta';
        usernameInput.parentElement.style.display = 'none';
      }
      emailInput.value = usernameInput.value = passwordInput.value = '';
      console.log("Nuevo modo:", authMode);
    }

    function saveUsers() {
      localStorage.setItem(LS_USERS, JSON.stringify(users));
      console.log("Guardado usuarios:", users);
    }
    function saveCurrentUser() {
      localStorage.setItem(LS_CURRENT, JSON.stringify(currentUser));
      console.log("Guardado usuario:", currentUser);
    }
    function performAuth() {
      console.log("performAuth, modo:", authMode);
      const email = emailInput.value.trim();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      console.log("Inputs:", { email, username, password });

      if (!email || !password || (authMode === 'register' && !username)) {
        showMessage('Rellena los campos correctamente');
        return;
      }
      if (authMode === 'register') {
        if (users[email]) {
          showMessage('Correo ya registrado');
          return;
        }
        users[email] = { username, password };
        currentUser = { email, username };
        saveUsers();
        saveCurrentUser();
        updateUIAfterLogin();
        closeLogin();
        openSection('Oficial');
        showMessage('Cuenta creada');
      } else {
        if (!users[email]) {
          showMessage('Correo no registrado');
          return;
        }
        if (users[email].password !== password) {
          showMessage('Contraseña incorrecta');
          return;
        }
        currentUser = { email, username: users[email].username };
        saveCurrentUser();
        updateUIAfterLogin();
        closeLogin();
        openSection('Oficial');
        showMessage('Sesión iniciada');
      }
    }

    function updateUIAfterLogin() {
      console.log("updateUIAfterLogin, usuario:", currentUser);
      if (currentUser) {
        userLabel.style.display = 'inline-block';
        userLabel.innerText = currentUser.username;
        openLoginBtn.style.display = 'none';
        if (!document.getElementById('logoutBtn')) {
          const btn = document.createElement('button');
          btn.id = 'logoutBtn';
          btn.innerText = 'Cerrar sesión';
          btn.onclick = logout;
          document.getElementById('userArea').appendChild(btn);
        } else {
          document.getElementById('logoutBtn').style.display = 'inline-block';
        }
      } else {
        userLabel.style.display = 'none';
        openLoginBtn.style.display = 'inline-block';
        const btn = document.getElementById('logoutBtn');
        if (btn) btn.remove();
        openSection(null);
      }
    }
    function logout() {
      console.log("Cerrar sesión");
      currentUser = null;
      saveCurrentUser();
      updateUIAfterLogin();
      showMessage('Sesión cerrada');
    }

    cards.forEach(card => {
      card.addEventListener('click', () => {
        console.log("Click card:", card.dataset.section);
        if (card.id === 'officialCard' && !currentUser) {
          showMessage('Debes iniciar sesión para entrar');
          return;
        }
        sections.forEach(sec => sec.classList.remove('show'));
        const section = document.getElementById(card.dataset.section);
        if (section) {
          section.classList.add('show');
          console.log("Mostrar sección:", card.dataset.section);
        }
        mainMenu.style.display = 'none';
        bodyClass(true);
      });
    });
    document.querySelectorAll('.backBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        console.log("Click volver");
        sections.forEach(sec => sec.classList.remove('show'));
        mainMenu.style.display = 'block';
        bodyClass(false);
      });
    });
    function bodyClass(hide) {
      if (hide) document.body.classList.add('video-hidden');
      else document.body.classList.remove('video-hidden');
      console.log("video-hidden:", hide);
    }

    openLoginBtn.addEventListener('click', openLogin);
    switchModeBtn.addEventListener('click', switchMode);
    primaryAuthBtn.addEventListener('click', performAuth);

    const commentForm = document.getElementById('commentForm');
    const commentsList = document.getElementById('commentsList');
    let comments = JSON.parse(localStorage.getItem('luxuryComments_v7') || '[]');
    console.log("Comentarios:", comments);
    function renderComments() {
      console.log("renderComments");
      commentsList.innerHTML = '';
      comments.forEach((c, i) => {
        const div = document.createElement('div');
        div.classList.add('commentItem');
        div.innerHTML = `<strong>${c.username}:</strong> ${c.text} <button onclick="deleteComment(${i})">Eliminar</button>`;
        commentsList.appendChild(div);
      });
    }
    function deleteComment(i) {
      console.log("deleteComment:", i);
      comments.splice(i, 1);
      localStorage.setItem('luxuryComments_v7', JSON.stringify(comments));
      renderComments();
    }
    commentForm.addEventListener('submit', e => {
      e.preventDefault();
      console.log("Submit comentario, user:", currentUser);
      if (!currentUser) {
        showMessage('Debes iniciar sesión para comentar');
        return;
      }
      const txt = document.getElementById('commentText').value.trim();
      if (!txt) return;
      comments.push({ username: currentUser.username, text: txt });
      localStorage.setItem('luxuryComments_v7', JSON.stringify(comments));
      renderComments();
      commentForm.reset();
    });
    renderComments();

    function createStars() {
      console.log("createStars");
      const section = document.getElementById('Oficial');
      for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.left = Math.random() * 100 + '%';
        star.style.width = star.style.height = (Math.random() * 3 + 2) + 'px';
        star.style.animationDuration = (Math.random() * 3 + 2) + 's';
        star.style.animationDelay = Math.random() * 5 + 's';
        section.appendChild(star);
      }
    }
    createStars();

    console.log("Script cargado completamente.");
  </script>
</body>
</html>
